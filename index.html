<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cat Chores">
<title>Pookie &amp; Lina — Chore Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #EDEAE1;
    --surface: #FFFFFF;
    --surface-tint: #F7F5EF;
    --ink: #333B44;
    --ink-soft: #7B8390;
    --divider: #DEDACC;
    --honey: #DE9F3D;
    --honey-tint: #F7E7CB;
    --sage: #7E9187;
    --sage-tint: #E4EAE4;
    --rust: #A85D3B;
    --rust-tint: #F1DDD2;
    --weekly-dot: #5B7FA6;
    --monthly-dot: #8B6FAE;
    --radius-lg: 22px;
    --radius-md: 14px;
    --radius-sm: 9px;
  }

  *{ box-sizing: border-box; }
  html, body{
    margin:0; padding:0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  body{
    min-height: 100vh;
    padding: 28px 16px 60px;
  }
  .wrap{
    max-width: 480px;
    margin: 0 auto;
  }

  header.top{
    position: relative;
    text-align:center;
    margin-bottom: 20px;
  }
  header.top .date{
    font-family: 'Fredoka', sans-serif;
    font-weight: 600;
    font-size: 19px;
    color: var(--ink);
  }
  .history-icon-btn{
    position: absolute;
    left: 0;
    top: 50%;
    transform: translateY(-50%);
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: var(--surface);
    border: 1px solid var(--divider);
    color: var(--ink-soft);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .history-icon-btn:active{ background: var(--divider); }
  .history-icon-btn svg{ width: 18px; height: 18px; }

  #catCards{
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .cat-card{
    background: var(--surface);
    border-radius: var(--radius-lg);
    padding: 16px 12px 14px;
    box-shadow: 0 1px 2px rgba(51,59,68,0.04), 0 8px 24px -16px rgba(51,59,68,0.25);
    min-width: 0;
  }

  .cat-head{
    display:flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 8px;
    margin-bottom: 14px;
  }

  .bowl{
    position: relative;
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: var(--surface-tint);
    border: 3px solid var(--divider);
    overflow: hidden;
    flex-shrink: 0;
  }
  .bowl-fill{
    position:absolute;
    left:0; right:0; bottom:0;
    height: 0%;
    transition: height 0.5s cubic-bezier(.4,0,.2,1);
    background-image:
      radial-gradient(circle at 30% 30%, rgba(255,255,255,0.35) 1.5px, transparent 1.6px),
      radial-gradient(circle at 65% 60%, rgba(255,255,255,0.25) 1.5px, transparent 1.6px);
    background-size: 10px 10px;
  }
  .bowl-fill.pookie{ background-color: var(--honey); }
  .bowl-fill.lina{ background-color: var(--sage); }

  .cat-title-block{ flex:1; }
  .cat-name{
    font-family: 'Fredoka', sans-serif;
    font-weight: 600;
    font-size: 17px;
    margin: 0 0 2px;
  }
  .cat-fraction{
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--ink-soft);
  }
  .cat-fraction.done{ color: var(--sage); }

  .section-label{
    font-family: 'JetBrains Mono', monospace;
    font-size: 9.5px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin: 14px 0 7px;
  }
  .section-label:first-of-type{ margin-top: 2px; }

  .task-list{
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .task-row{
    display:flex;
    align-items:center;
    gap: 9px;
    padding: 9px 9px;
    border-radius: var(--radius-md);
    background: var(--surface-tint);
    cursor: pointer;
    user-select: none;
    border: 1px solid transparent;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .task-row:active{ background: var(--divider); }
  .task-row.overdue{
    background: var(--rust-tint);
  }

  .check{
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 2px solid var(--divider);
    background: var(--surface);
    flex-shrink: 0;
    display:flex;
    align-items:center;
    justify-content:center;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .task-row.done .check{
    background: var(--honey);
    border-color: var(--honey);
  }
  .task-row.done.lina .check{
    background: var(--sage);
    border-color: var(--sage);
  }
  .check svg{
    width: 12px; height: 12px;
    opacity: 0;
    transition: opacity 0.15s ease;
  }
  .task-row.done .check svg{ opacity: 1; }

  .task-label-block{ flex:1; min-width:0; }
  .task-label{
    font-size: 12.5px;
    font-weight: 500;
    line-height: 1.3;
  }
  .task-row.done .task-label{
    color: var(--ink-soft);
    text-decoration: line-through;
    text-decoration-color: var(--ink-soft);
  }
  .task-meta{
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    color: var(--ink-soft);
    margin-top: 2px;
  }
  .badge{
    font-family: 'JetBrains Mono', monospace;
    font-size: 8.5px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    background: var(--rust);
    color: #fff;
    padding: 2px 6px;
    border-radius: 20px;
    flex-shrink: 0;
  }

  .all-caught-up{
    font-size: 13px;
    color: var(--ink-soft);
    padding: 10px 2px 2px;
  }

  footer.foot{
    text-align:center;
    font-size: 11.5px;
    color: var(--ink-soft);
    margin-top: 8px;
  }

  .history-link{
    display:inline-block;
    margin-top: 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11.5px;
    color: var(--ink-soft);
    background: none;
    border: none;
    text-decoration: underline;
    text-underline-offset: 2px;
    cursor: pointer;
    padding: 4px;
  }
  .history-link:active{ color: var(--ink); }

  .history-overlay{
    position: fixed;
    inset: 0;
    background: rgba(51,59,68,0.45);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    z-index: 50;
  }
  .history-overlay.hidden{ display: none; }

  .history-panel{
    background: var(--bg);
    width: 100%;
    max-width: 480px;
    max-height: 85vh;
    overflow-y: auto;
    border-radius: 22px 22px 0 0;
    padding: 18px 18px 28px;
  }

  .history-head{
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }
  .history-head h2{
    font-family: 'Fredoka', sans-serif;
    font-weight: 600;
    font-size: 19px;
    margin: 0;
  }
  .history-close{
    background: var(--surface-tint);
    border: none;
    width: 30px; height: 30px;
    border-radius: 50%;
    font-size: 15px;
    color: var(--ink-soft);
    cursor: pointer;
  }

  .cal-nav{
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .cal-nav-btn{
    width: 30px; height: 30px;
    border-radius: 50%;
    border: 1px solid var(--divider);
    background: var(--surface-tint);
    color: var(--ink);
    font-size: 16px;
    cursor: pointer;
  }
  .cal-month-label{
    font-family: 'Fredoka', sans-serif;
    font-weight: 600;
    font-size: 15px;
    margin: 0;
  }

  .cal-weekdays{
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    text-align: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--ink-soft);
    margin-bottom: 4px;
  }

  .cal-grid{
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 3px;
    margin-bottom: 10px;
  }
  .cal-cell{
    aspect-ratio: 1;
    border: 1px solid transparent;
    background: var(--surface-tint);
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    padding: 0;
  }
  .cal-cell.empty{
    background: transparent;
    cursor: default;
  }
  .cal-cell.today{ border-color: var(--ink-soft); }
  .cal-cell.selected{
    background: var(--ink);
  }
  .cal-cell.selected .cal-day-num{ color: #fff; }
  .cal-day-num{
    font-size: 12.5px;
    font-weight: 500;
    color: var(--ink);
  }
  .cal-dots{
    display: flex;
    gap: 2px;
    height: 6px;
  }
  .cal-dot{
    width: 5px; height: 5px;
    border-radius: 50%;
    display: inline-block;
  }
  .cal-dot.weekly{ background: var(--weekly-dot); }
  .cal-dot.monthly{ background: var(--monthly-dot); }

  .cal-legend{
    display: flex;
    gap: 14px;
    font-size: 11px;
    color: var(--ink-soft);
    margin-bottom: 16px;
  }
  .cal-legend span{
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  .cal-legend i.cal-dot{ display:inline-block; }

  .day-detail{
    border-top: 1px solid var(--divider);
    padding-top: 14px;
  }
  .detail-date{
    font-family: 'Fredoka', sans-serif;
    font-weight: 600;
    font-size: 15px;
    margin: 0 0 10px;
  }
  .detail-cat-block{ margin-bottom: 16px; }
  .detail-cat-block:last-child{ margin-bottom: 0; }
  .detail-cat-name{
    font-family: 'Fredoka', sans-serif;
    font-weight: 600;
    font-size: 13.5px;
    margin: 0 0 6px;
  }
  .detail-tasks{
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .detail-task-row{
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12.5px;
    color: var(--ink-soft);
  }
  .detail-task-row.done{ color: var(--ink); }
  .detail-check{
    width: 16px; height: 16px;
    border-radius: 50%;
    border: 1.5px solid var(--divider);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .detail-task-row.done .detail-check{
    background: var(--honey);
    border-color: var(--honey);
  }
  .detail-check svg{ width: 9px; height: 9px; }
  .detail-periodic-row{
    margin-top: 6px;
    font-size: 12px;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .detail-freq-tag{
    font-family: 'JetBrains Mono', monospace;
    font-size: 9.5px;
    text-transform: uppercase;
    color: #fff;
    padding: 1px 6px;
    border-radius: 20px;
  }
  .detail-periodic-row.weekly .detail-freq-tag{ background: var(--weekly-dot); }
  .detail-periodic-row.monthly .detail-freq-tag{ background: var(--monthly-dot); }

  .history-empty{
    color: var(--ink-soft);
    font-size: 12px;
    padding: 4px 2px;
  }

  @media (prefers-reduced-motion: reduce){
    .bowl-fill{ transition: none; }
  }
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <button class="history-icon-btn" id="historyBtn" type="button" aria-label="View history">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="3.5" y="5" width="17" height="16" rx="3" stroke="currentColor" stroke-width="1.6"/>
        <path d="M3.5 9.5H20.5" stroke="currentColor" stroke-width="1.6"/>
        <path d="M8 3V6.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M16 3V6.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
    </button>
    <p class="date" id="todayLabel"></p>
  </header>

  <div id="catCards"></div>

  <footer class="foot">Taps sync for everyone — refresh if you don't see the latest.</footer>
</div>

<div class="history-overlay hidden" id="historyOverlay">
  <div class="history-panel">
    <div class="history-head">
      <h2>History</h2>
      <button class="history-close" id="historyClose" type="button">✕</button>
    </div>
    <div id="historyContent"><p class="history-empty">Loading…</p></div>
  </div>
</div>

<script>
(function(){

  const CATS = [
    { id: 'pookie', name: 'Pookie', accent: 'pookie' },
    { id: 'lina', name: 'Lina', accent: 'lina' }
  ];

  const DAILY_TASKS = [
    { id: 'breakfast', label: 'Feed breakfast' },
    { id: 'water-am', label: 'Change water' },
    { id: 'litter-box', label: 'Clear litter box' },
    { id: 'lunch', label: 'Feed lunch' },
    { id: 'dinner', label: 'Feed dinner' },
    { id: 'water-pm', label: 'Change water' },
    { id: 'brush-fur', label: 'Brush fur' },
    { id: 'brush-teeth', label: 'Brush teeth' }
  ];

  const PERIODIC_TASKS = [
    { id: 'ear-clean', label: 'Clean ears', freq: 'weekly' },
    { id: 'nail-trim', label: 'Trim nails', freq: 'monthly' },
    { id: 'sanitary-trim', label: 'Sanitary trim', freq: 'monthly' }
  ];

  function pad(n){ return n < 10 ? '0' + n : '' + n; }

  function todayKey(d){
    d = d || new Date();
    return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
  }

  function monthKey(d){
    d = d || new Date();
    return d.getFullYear() + '-' + pad(d.getMonth()+1);
  }

  // ISO week key, e.g. 2026-W31
  function weekKey(d){
    d = d ? new Date(d) : new Date();
    d.setHours(0,0,0,0);
    d.setDate(d.getDate() + 3 - ((d.getDay() + 6) % 7));
    const week1 = new Date(d.getFullYear(), 0, 4);
    const weekNo = 1 + Math.round(((d - week1) / 86400000 - 3 + ((week1.getDay() + 6) % 7)) / 7);
    return d.getFullYear() + '-W' + pad(weekNo);
  }

  function periodKeyFor(freq){
    return freq === 'weekly' ? weekKey() : monthKey();
  }

  function friendlyDate(){
    return new Date().toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
  }

  const SUPABASE_URL = 'https://xnuaacerqstbctmvvevl.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_Zd__R1yeYo1UePL213ipIw_XnriiwRY';
  const REST_ENDPOINT = SUPABASE_URL + '/rest/v1/chore_state';

  async function getJSON(key){
    try{
      const res = await fetch(REST_ENDPOINT + '?key=eq.' + encodeURIComponent(key) + '&select=value', {
        headers: {
          apikey: SUPABASE_KEY,
          Accept: 'application/json'
        }
      });
      if (!res.ok) return null;
      const rows = await res.json();
      return rows.length ? rows[0].value : null;
    } catch(e){
      console.error('Supabase read failed', e);
      return null;
    }
  }

  function setJSON(key, obj){
    // Fire-and-forget: caller does not wait on this, so taps feel instant.
    return fetch(REST_ENDPOINT, {
      method: 'POST',
      headers: {
        apikey: SUPABASE_KEY,
        'Content-Type': 'application/json',
        'Prefer': 'resolution=merge-duplicates,return=minimal'
      },
      body: JSON.stringify([{ key: key, value: obj, updated_at: new Date().toISOString() }])
    }).catch(e => console.error('Supabase write failed', e));
  }

  function checkIcon(){
    return '<svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">' +
      '<path d="M3 8.5L6.2 11.5L13 4.5" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>' +
      '</svg>';
  }

  function daysAgoLabel(isoString){
    if (!isoString) return 'never done';
    const then = new Date(isoString);
    const diffDays = Math.floor((Date.now() - then.getTime()) / 86400000);
    if (diffDays <= 0) return 'done today';
    if (diffDays === 1) return 'done yesterday';
    return 'done ' + diffDays + ' days ago';
  }

  // ---- In-memory cache: rendering reads only from here, never blocks on network ----
  const CAT_STATE = {};
  let suppressSyncUntil = 0;

  function emptyCatState(){
    return { daily: { date: todayKey(), tasks: {} }, periodic: {} };
  }

  async function fetchCatState(catId){
    const val = await getJSON('cat:' + catId);
    if (!val) return emptyCatState();
    const rolledOver = !!(val.daily && val.daily.date && val.daily.date !== todayKey());
    if (rolledOver){
      persistDailySnapshot(catId, val.daily.date, val.daily.tasks || {});
    }
    const state = {
      daily: (val.daily && val.daily.date === todayKey()) ? val.daily : { date: todayKey(), tasks: {} },
      periodic: val.periodic || {}
    };
    return state;
  }

  function persistCatState(catId){
    setJSON('cat:' + catId, CAT_STATE[catId]);
  }

  function persistDailySnapshot(catId, dateStr, tasksObj){
    // Fire-and-forget log of that day's task state, kept even after the date rolls over.
    setJSON('daily-log:' + catId + ':' + dateStr, tasksObj);
  }

  async function appendPeriodicLog(catId, entry){
    const key = 'periodic-log:' + catId;
    const existing = (await getJSON(key)) || [];
    existing.push(entry);
    setJSON(key, existing.slice(-30));
  }

  function renderCat(cat){
    const state = CAT_STATE[cat.id] || emptyCatState();
    const dailyTasks = state.daily.tasks;
    const doneCount = DAILY_TASKS.filter(t => dailyTasks[t.id]).length;
    const totalCount = DAILY_TASKS.length;
    const fillPct = Math.round((doneCount / totalCount) * 100);

    const periodicDisplay = PERIODIC_TASKS.map(t => {
      const st = state.periodic[t.id] || { periodKey: null, done: false, completedAt: null };
      const currentPeriod = periodKeyFor(t.freq);
      const isDue = st.periodKey !== currentPeriod || !st.done;
      const completedToday = !!st.completedAt && todayKey(new Date(st.completedAt)) === todayKey();
      return { task: t, state: st, isDue, doneToday: completedToday && !isDue };
    }).filter(d => d.isDue || d.doneToday);

    const anyDue = periodicDisplay.some(d => d.isDue);

    const dailyRows = DAILY_TASKS.map(t => {
      const done = !!dailyTasks[t.id];
      return `
        <div class="task-row ${done ? 'done ' + cat.accent : ''}" data-kind="daily" data-cat="${cat.id}" data-task="${t.id}">
          <div class="check">${checkIcon()}</div>
          <div class="task-label-block">
            <div class="task-label">${t.label}</div>
          </div>
        </div>`;
    }).join('');

    const periodicRows = periodicDisplay.map(({task, state, isDue, doneToday}) => {
      const rowClass = isDue ? 'overdue' : ('done ' + cat.accent);
      const badge = isDue ? '<div class="badge">Due</div>' : '';
      return `
        <div class="task-row ${rowClass}" data-kind="periodic" data-cat="${cat.id}" data-task="${task.id}" data-freq="${task.freq}">
          <div class="check">${checkIcon()}</div>
          <div class="task-label-block">
            <div class="task-label">${task.label}</div>
            <div class="task-meta">${task.freq} · ${daysAgoLabel(state.completedAt)}</div>
          </div>
          ${badge}
        </div>`;
    }).join('');

    const periodicSection = periodicDisplay.length
      ? `<p class="section-label">Weekly &amp; monthly</p><div class="task-list">${periodicRows}</div>`
      : '';

    return `
      <div class="cat-card" id="card-${cat.id}">
        <div class="cat-head">
          <div class="bowl">
            <div class="bowl-fill ${cat.accent}" style="height:${fillPct}%"></div>
          </div>
          <div class="cat-title-block">
            <p class="cat-name">${cat.name}</p>
            <p class="cat-fraction ${doneCount === totalCount ? 'done' : ''}">${doneCount}/${totalCount} today</p>
          </div>
        </div>
        <p class="section-label">Daily</p>
        <div class="task-list">${dailyRows}</div>
        ${periodicSection}
        ${(doneCount === totalCount && !anyDue) ? '<p class="all-caught-up">All caught up today.</p>' : ''}
      </div>
    `;
  }

  function renderAll(){
    const container = document.getElementById('catCards');
    container.innerHTML = CATS.map(renderCat).join('');
    attachHandlers();
  }

  async function syncFromServer(){
    if (Date.now() < suppressSyncUntil) return;
    const fresh = await Promise.all(CATS.map(c => fetchCatState(c.id)));
    CATS.forEach((c, i) => { CAT_STATE[c.id] = fresh[i]; });
    renderAll();
  }

  function attachHandlers(){
    document.querySelectorAll('.task-row').forEach(row => {
      row.addEventListener('click', () => {
        const kind = row.dataset.kind;
        const catId = row.dataset.cat;
        const taskId = row.dataset.task;
        const state = CAT_STATE[catId];

        if (kind === 'daily'){
          state.daily.tasks[taskId] = !state.daily.tasks[taskId];
        } else {
          const freq = row.dataset.freq;
          const currentPeriod = periodKeyFor(freq);
          const st = state.periodic[taskId] || { periodKey: null, done: false, completedAt: null };
          const isDue = st.periodKey !== currentPeriod || !st.done;
          if (isDue){
            const nowIso = new Date().toISOString();
            state.periodic[taskId] = { periodKey: currentPeriod, done: true, completedAt: nowIso };
            appendPeriodicLog(catId, { taskId: taskId, freq: freq, completedAt: nowIso });
          } else {
            state.periodic[taskId] = { periodKey: st.periodKey, done: false, completedAt: st.completedAt };
          }
        }

        // Update the screen immediately; persist quietly in the background.
        renderAll();
        persistCatState(catId);
        suppressSyncUntil = Date.now() + 3000;
      });
    });
  }

  async function init(){
    document.getElementById('todayLabel').textContent = friendlyDate();
    CATS.forEach(c => { CAT_STATE[c.id] = emptyCatState(); });
    renderAll();
    await syncFromServer();
  }

  init();

  // Keep views in sync across devices
  setInterval(syncFromServer, 6000);
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) syncFromServer();
  });
  window.addEventListener('focus', syncFromServer);

  // ---- History view: calendar ----

  async function getMultiJSON(keys){
    if (!keys.length) return {};
    try{
      const filter = keys.map(encodeURIComponent).join(',');
      const res = await fetch(REST_ENDPOINT + '?key=in.(' + filter + ')&select=key,value', {
        headers: { apikey: SUPABASE_KEY, Accept: 'application/json' }
      });
      if (!res.ok) return {};
      const rows = await res.json();
      const map = {};
      rows.forEach(r => { map[r.key] = r.value; });
      return map;
    } catch(e){
      console.error('Supabase multi-read failed', e);
      return {};
    }
  }

  let calYear, calMonth, selectedDateKey;
  const periodicLogCache = {};

  function daysInMonth(year, month){ return new Date(year, month + 1, 0).getDate(); }
  function firstWeekdayOfMonth(year, month){ return new Date(year, month, 1).getDay(); }

  async function openHistory(){
    document.getElementById('historyOverlay').classList.remove('hidden');
    const now = new Date();
    calYear = now.getFullYear();
    calMonth = now.getMonth();
    selectedDateKey = todayKey();

    document.getElementById('historyContent').innerHTML = '<p class="history-empty">Loading…</p>';
    const map = await getMultiJSON(CATS.map(c => 'periodic-log:' + c.id));
    CATS.forEach(c => { periodicLogCache[c.id] = map['periodic-log:' + c.id] || []; });

    renderCalendarGrid();
    renderDayDetail(selectedDateKey);
  }

  function closeHistory(){
    document.getElementById('historyOverlay').classList.add('hidden');
  }

  function renderCalendarGrid(){
    const container = document.getElementById('historyContent');
    const monthLabel = new Date(calYear, calMonth, 1).toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
    const firstWeekday = firstWeekdayOfMonth(calYear, calMonth);
    const totalDays = daysInMonth(calYear, calMonth);

    const weeklyDates = new Set();
    const monthlyDates = new Set();
    CATS.forEach(cat => {
      (periodicLogCache[cat.id] || []).forEach(e => {
        const d = new Date(e.completedAt);
        if (d.getFullYear() === calYear && d.getMonth() === calMonth){
          const key = todayKey(d);
          (e.freq === 'weekly' ? weeklyDates : monthlyDates).add(key);
        }
      });
    });

    let cellsHTML = '';
    for (let i = 0; i < firstWeekday; i++){
      cellsHTML += '<div class="cal-cell empty"></div>';
    }
    for (let day = 1; day <= totalDays; day++){
      const d = new Date(calYear, calMonth, day);
      const key = todayKey(d);
      const isToday = key === todayKey();
      const isSelected = key === selectedDateKey;
      let dots = '';
      if (weeklyDates.has(key)) dots += '<span class="cal-dot weekly"></span>';
      if (monthlyDates.has(key)) dots += '<span class="cal-dot monthly"></span>';
      cellsHTML += `
        <button class="cal-cell ${isToday ? 'today' : ''} ${isSelected ? 'selected' : ''}" data-date="${key}" type="button">
          <span class="cal-day-num">${day}</span>
          <span class="cal-dots">${dots}</span>
        </button>`;
    }

    container.innerHTML = `
      <div class="cal-nav">
        <button class="cal-nav-btn" id="calPrev" type="button">‹</button>
        <p class="cal-month-label">${monthLabel}</p>
        <button class="cal-nav-btn" id="calNext" type="button">›</button>
      </div>
      <div class="cal-weekdays"><span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span></div>
      <div class="cal-grid">${cellsHTML}</div>
      <div class="cal-legend">
        <span><i class="cal-dot weekly"></i>Weekly done</span>
        <span><i class="cal-dot monthly"></i>Monthly done</span>
      </div>
      <div id="dayDetail" class="day-detail"><p class="history-empty">Loading…</p></div>
    `;

    document.getElementById('calPrev').addEventListener('click', () => {
      calMonth--; if (calMonth < 0){ calMonth = 11; calYear--; }
      renderCalendarGrid();
      renderDayDetail(selectedDateKey);
    });
    document.getElementById('calNext').addEventListener('click', () => {
      calMonth++; if (calMonth > 11){ calMonth = 0; calYear++; }
      renderCalendarGrid();
      renderDayDetail(selectedDateKey);
    });
    container.querySelectorAll('.cal-cell:not(.empty)').forEach(cell => {
      cell.addEventListener('click', () => {
        selectedDateKey = cell.dataset.date;
        renderCalendarGrid();
        renderDayDetail(selectedDateKey);
      });
    });
  }

  function renderDayDetail(dateKey){
    const detailEl = document.getElementById('dayDetail');
    if (!detailEl) return;

    const dateObj = new Date(dateKey + 'T00:00:00');
    const dateLabel = dateObj.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });

    const blocksHTML = CATS.map(cat => {
      const periodicToday = (periodicLogCache[cat.id] || []).filter(e => todayKey(new Date(e.completedAt)) === dateKey);

      const periodicHTML = periodicToday.length
        ? periodicToday.map(e => {
            const task = PERIODIC_TASKS.find(t => t.id === e.taskId);
            const label = task ? task.label : e.taskId;
            return `<div class="detail-periodic-row ${e.freq}"><span>${label}</span><span class="detail-freq-tag">${e.freq}</span></div>`;
          }).join('')
        : '<p class="history-empty">Nothing logged this day.</p>';

      return `
        <div class="detail-cat-block">
          <p class="detail-cat-name">${cat.name}</p>
          ${periodicHTML}
        </div>`;
    }).join('');

    detailEl.innerHTML = `<p class="detail-date">${dateLabel}</p>${blocksHTML}`;
  }

  document.getElementById('historyBtn').addEventListener('click', openHistory);
  document.getElementById('historyClose').addEventListener('click', closeHistory);
  document.getElementById('historyOverlay').addEventListener('click', (e) => {
    if (e.target.id === 'historyOverlay') closeHistory();
  });

})();
</script>

</body>
